<style>

  --ac:#13a571;--acd:#0e8a5d;--acs:rgba(19,165,113,.12);--warn:#d98a1f;--bad:#d4513f;--blue:#2f7fcb;--vio:#7a63d6;--cyan:#1aa3c4;--r:16px;--shadow:0 1px 2px rgba(20,40,30,.05),0 4px 14px rgba(20,40,30,.04);
}

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(74px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);padding:10px 14px 8px;border-bottom:1px solid var(--line)}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.chips{display:flex;gap:6px;flex-wrap:wrap}

.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac);margin-left:5px;vertical-align:middle}

.seg button.on{background:var(--card);color:var(--ac);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.14);outline:1px solid color-mix(in srgb,var(--ac) 40%,transparent)}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}

.mrow{display:flex;justify-content:space-between;font-size:13px;margin:8px 0 4px}

.step{display:flex;align-items:center;gap:6px}

.lvl{display:flex;gap:5px}

.list .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}

.tbl{width:100%;border-collapse:collapse;font-size:13px}

.ex{border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:10px;background:var(--card2)}

.hint{font-size:12px;padding:4px 9px;border-radius:8px;margin:2px 0 6px;display:inline-block}
.hint.up{background:var(--acs);color:var(--ac)}.hint.down{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}.hint.keep{background:rgba(143,152,168,.12);color:var(--mut)}
.sets{width:100%;border-collapse:collapse}
.sets th{font-size:11px;color:var(--mut);font-weight:500;text-align:center;padding:2px}
.sets td{padding:3px}
.sets input{padding:8px 4px;font-size:15px;text-align:center}
.sets td.i{width:22px;color:var(--mut);font-size:12px;text-align:center}

nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:color-mix(in srgb,var(--card) 96%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}

.chart svg{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--tx);color:var(--bg);padding:10px 15px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:40;max-width:90vw}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:30}
.modal.on{display:flex}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.banner{font-size:12.5px;padding:9px 11px;border-radius:12px;background:color-mix(in srgb,var(--warn) 12%,transparent);color:color-mix(in srgb,var(--warn) 80%,var(--tx));margin-bottom:10px}
.banner.ok{background:var(--acs);color:color-mix(in srgb,var(--ac) 75%,var(--tx))}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;background:var(--card2);border:1px solid var(--line);color:var(--soft)}
.tgt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.tgt div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 2px}
.tgt b{display:block;font-size:17px}
.tgt span{font-size:11px;color:var(--mut)}
.legend-grad{height:8px;border-radius:5px;background:linear-gradient(90deg,#4a5160 0%,#3a5b9c 15%,#3f9fb0 55%,#3fbf8f 100%)}
details summary{cursor:pointer;color:var(--mut);font-size:13px;padding:6px 0}
.sep{height:1px;background:var(--line);margin:12px 0}
a{color:var(--blue)}
.info p{margin:6px 0;font-size:13.5px;color:var(--soft)}
.info h4{margin:12px 0 4px;font-size:14px}

.icon-btn.on{color:var(--ac)}
.cf{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;background:var(--card2);border:1px solid var(--line);border-radius:14px;width:100%}
.cf-l{font-size:12px;color:var(--mut)}
.cf-v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif}
.cf-v small{font-size:13px;color:var(--mut);font-weight:500}
.cf-ph{color:var(--mut);font-weight:400}
.cell{width:100%;padding:9px 2px;font-size:15px;font-variant-numeric:tabular-nums;text-align:center;border-radius:10px;background:var(--card2)}
.sets tr.done .cell{border-color:color-mix(in srgb,var(--ac) 45%,var(--line))}
.crown{text-align:center}
.crown-t{font-weight:650;font-size:15px;margin-bottom:6px}
.crown-dial{position:relative;width:240px;height:240px;margin:0 auto;touch-action:none;cursor:grab;user-select:none}
.crown-dial svg{width:100%;height:100%;display:block}
.crown-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.crown-num{pointer-events:auto;width:150px;text-align:center;font-size:46px;font-weight:300;letter-spacing:-.03em;font-variant-numeric:tabular-nums;font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;background:transparent;border:0;padding:0;color:var(--tx)}
.crown-u{font-size:14px;color:var(--mut);margin-top:-2px}
.crown-b{width:64px;height:44px;font-size:22px;border-radius:22px}
.sleepbox{margin-top:12px;padding:10px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
.sleepbox input[type=time]{padding:6px 6px;font-size:14px;min-width:0}
.sleepbox .lvl button{padding:5px 0;font-size:12px}
.qrow{padding:10px 0;border-bottom:1px solid var(--line)}
.qn{font-size:13.5px;font-weight:600;margin-bottom:7px}
.gauges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px;text-align:center}
.gauge svg{width:100%;max-width:150px}
.gauge .v{font-size:13.5px;font-weight:650;margin-top:-4px}.gauge .l{font-size:11.5px;color:var(--mut)}
.tgt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.tg{position:relative;overflow:hidden;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 2px}
.tg::before{content:"";position:absolute;left:0;bottom:0;height:4px;width:var(--p);background:var(--ac)}
.tg b{display:block;font-size:16px}.tg b .mut{font-size:11px;font-weight:500}.tg span{font-size:11px;color:var(--mut)}
.pips{display:inline-flex;gap:3px;vertical-align:middle;flex-wrap:wrap}
.pip{width:9px;height:9px;border-radius:50%;background:var(--track);display:inline-block}
.pip.on{background:var(--ac)}
.pipsep{display:inline-block;width:8px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:14px;padding:9px 8px;min-height:70px;background:var(--card2);text-align:left;display:flex;flex-direction:column;justify-content:flex-end}
.tile.sel{border-color:var(--ac);border-width:2px}
.tile .fill{position:absolute;left:0;right:0;bottom:0;opacity:.32;transition:height .4s}
.tile b{position:relative;font-size:19px;font-variant-numeric:tabular-nums}
.tile span{position:relative;font-size:11.5px;color:var(--soft);line-height:1.2}
.rec{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.rec i{flex:0 0 8px;height:8px;border-radius:50%;margin-top:6px}
.track{display:grid;grid-template-columns:repeat(12,1fr);gap:2px}
.tw{position:relative;text-align:center}.tw svg{width:100%}.tw span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--mut)}
.tw.cur span{color:var(--ac);font-weight:800}
.cal{display:flex;gap:4px;overflow-x:auto}
.cal-d,.cal-w{display:grid;grid-template-rows:repeat(7,1fr);gap:4px}
.cal-d span{font-size:10px;color:var(--mut);height:18px;line-height:18px}
.cal-w i{width:18px;height:18px;border-radius:5px;background:var(--card2);border:1px solid var(--line);display:block}
.cal-w i.today{outline:2px solid var(--ac);outline-offset:1px}
.calk{width:12px;height:12px;border-radius:3px;display:inline-block}
.ins{padding:9px 0;border-bottom:1px solid var(--line)}
details.wk{border-bottom:1px solid var(--line);padding:4px 0}
details.wk summary{color:var(--tx);font-size:14px;padding:8px 0}
.wkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.wkgrid div{background:var(--card2);border-radius:10px;padding:6px 8px}.wkgrid span{display:block;font-size:11px;color:var(--mut)}.wkgrid b{font-size:14px}
.mx table{border-collapse:separate;border-spacing:2px;width:100%;table-layout:fixed}.mx col.l{width:74px}
.mx th{font-size:10.5px;color:var(--mut);font-weight:600}.mx th:first-child{width:74px}
.mx td:first-child{font-size:11.5px;line-height:1.15;padding-right:2px;color:var(--soft);width:74px}.mx td:first-child .mut{font-size:10px}
.mxc{width:100%;height:28px;padding:0;border-radius:9px;font-size:10px;color:var(--ac)}

.store{display:grid;grid-template-columns:2fr 1fr;gap:8px}.store div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px}.store b{display:block;font-size:15px}.store span{font-size:12px;color:var(--mut)}
.gcat{font-size:12px;font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 4px}

.holo{position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#0d2a3a 0%,#071820 55%,#040c11 100%);border:1px solid #12384a}

.sm.ghost.del{color:var(--bad)}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>Mike Tracker</h1>
    <span id="sync" class="sync">local</span>
    <button class="icon-btn" id="setB" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>

<script>
"use strict";
let deferredPrompt=null;
/* ================= DATOS BASE DEL PLAN ================= */
const ACTS = {
  A:{n:"A · Torso",k:"fuerza"}, B:{n:"B · Calistenia",k:"fuerza"}, C:{n:"C · Pierna + V",k:"fuerza"},
  tenis:{n:"Tenis",k:"act",h:21}, natacion:{n:"Natación",k:"act",h:10}, correr:{n:"Correr",k:"act",h:7},
  caminata:{n:"Caminata",k:"act",h:18}, box:{n:"Box",k:"act",h:19}, ciclismo:{n:"Bici",k:"act",h:9},
  yoga:{n:"Yoga / movilidad",k:"suave"}, descanso:{n:"Descanso",k:"desc"}, otro:{n:"Otro",k:"act",h:19}
};

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseISO=s=>{const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d);};
const mondayOf=s=>{const d=parseISO(s); d.setDate(d.getDate()-((d.getDay()+6)%7)); return iso(d);};
const num=v=>{ if(v===""||v==null) return null; const n=parseFloat(String(v).replace(",",".")); return isFinite(n)?n:null; };
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(n,d=1)=>n==null||!isFinite(n)?"—":(Math.round(n*Math.pow(10,d))/Math.pow(10,d)).toLocaleString("es-MX",{maximumFractionDigits:d});
const avg=a=>{const v=a.filter(x=>x!=null&&isFinite(x)); return v.length? v.reduce((s,x)=>s+x,0)/v.length:null;};
const clone=o=>JSON.parse(JSON.stringify(o));

function frac(x){ // cantidades amigables: 1¼, ½, ⅓
  if(x==null||!isFinite(x)) return "—"; if(x>=10) return String(Math.round(x));
  const w=Math.floor(x), r=x-w; const opts=[[0,""],[.25,"¼"],[.333,"⅓"],[.5,"½"],[.667,"⅔"],[.75,"¾"],[1,""]];
  let best=opts[0]; opts.forEach(o=>{ if(Math.abs(r-o[0])<Math.abs(r-best[0])) best=o; });
  const W = best[0]===1? w+1 : w; return (W? W:"")+(best[1]||(W?"":"0"));
}
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),2300); }

const LS_KEY="mike_tracker_v1";
const Store={
  mode:"local",db:null,uid:null,config:clone(DEF_CONFIG),days:{},dirty:new Set(),timers:{},writing:{},queued:{},
  loadLocal(){ try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const o=JSON.parse(raw); if(o.config) this.config=mergeConfig(o.config); if(o.days) this.days=o.days; } }catch(e){} },
  saveLocal(){ try{ localStorage.setItem(LS_KEY,JSON.stringify({config:this.config,days:this.days})); }catch(e){} },
  async initCloud(){
    if(!(window.claude&&typeof window.claude.use==="function")) return false;
    try{ const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]); if(!db||!user) return false;
      const id=await user.id(); if(!id) return false; this.db=db; this.uid=id; return true; }catch(e){ return false; }
  },
  col(){ return this.db.collection("data/users/"+this.uid); },
  subscribe(onData){
    let first=true; const timer=setTimeout(()=>setSync("sin conexión",false),10000);
    this.col().onSnapshot(snap=>{
      if(!snap.metadata.fromCache){ clearTimeout(timer); setSync("nube ✓",true); }
      let changed=false;
      snap.docs.forEach(d=>{ const data=d.data(); if(!data||this.dirty.has(d.id)) return;
        if(d.id==="config"){ this.config=mergeConfig(data); changed=true; }
        else if(d.id.startsWith("d")){ const k=d.id.slice(1); if(JSON.stringify(this.days[k])!==JSON.stringify(data)){ this.days[k]=clone(data); changed=true; } } });
      if(first&&snap.empty&&!snap.metadata.fromCache) this.migrateLocal();
      if(!snap.metadata.fromCache) first=false;
      if(changed) onData();
    },()=>{ clearTimeout(timer); setSync("solo local",false); this.mode="local"; });
  },
  migrateLocal(){ let raw=null; try{raw=localStorage.getItem(LS_KEY);}catch(e){} if(!raw) return; let o; try{o=JSON.parse(raw);}catch(e){return;}
    if(o.config){ this.config=mergeConfig(o.config); this.markDirty("config"); } if(o.days) for(const k in o.days){ this.days[k]=o.days[k]; this.markDirty("d"+k); } },
  markDirty(id){ this.saveLocal(); if(this.mode!=="cloud") return; this.dirty.add(id); clearTimeout(this.timers[id]); this.timers[id]=setTimeout(()=>this.flush(id),700); setSync("guardando…",true); },
  async flush(id){
    if(this.writing[id]){ this.queued[id]=true; return; } this.writing[id]=true;
    const body=id==="config"?this.config:this.days[id.slice(1)];
    try{ if(body) await this.col().doc(id).set(clone(body)); else await this.col().doc(id).delete(); setSync("nube ✓",true); }
    catch(e){ if(e&&e.code==="quota_exceeded") toast("La nube está llena: exporta un respaldo y borra días viejos."); else if(e&&e.code==="unavailable") setTimeout(()=>this.flush(id),1500+Math.random()*1000); else setSync("solo local",false); }
    this.writing[id]=false; if(this.queued[id]){ this.queued[id]=false; this.flush(id); } else this.dirty.delete(id);
  }
};
function mergeConfig(c){
  const o=Object.assign(clone(DEF_CONFIG),c||{});
  o.show=Object.assign(clone(DEF_CONFIG.show),(c&&c.show)||{});
  o.goals=Object.assign(clone(DEF_CONFIG.goals),(c&&c.goals)||{});
  ["templates","meals","foods","metrics","exMap","presets","units","weekTxt"].forEach(k=>{ if(!o[k]) o[k]=clone(DEF_CONFIG[k]); });
  // semana: de texto a lista de actividades
  const w={}; for(let i=0;i<7;i++){ const v=o.week&&o.week[i]; w[i]=Array.isArray(v)?v:(v?[v]:["descanso"]); } o.week=w;
  o.presets=o.presets.map(p=>{ const pw={}; for(let i=0;i<7;i++){ const v=p.week&&p.week[i]; pw[i]=Array.isArray(v)?v:(v?[v]:["descanso"]); } return Object.assign({},p,{week:pw,txt:p.txt||{}}); });
  // fases con macros completos
  o.phases=(o.phases||[]).map(p=>{ const P=p.P||p.prot||170; const F=p.F||Math.round(p.kcal*.25/9); const C=p.C||Math.max(0,Math.round((p.kcal-P*4-F*9)/4)); return {from:p.from,name:p.name,kcal:p.kcal,P,C,F}; });
  if(!o.phases.length) o.phases=clone(DEF_CONFIG.phases);
  // comidas antiguas sin reparto
  o.meals=o.meals.map(m=>{ const d=DEF_MEALS.find(x=>x.id===m.id); return {id:m.id,n:m.n,h:m.h,sh:m.sh||(d?d.sh:{P:.15,C:.15,F:.15})}; });
  return o;
}

function strengthOf(k=cur){ const a=acts(k).find(x=>ACTS[x.t]&&ACTS[x.t].k==="fuerza"); return a?a.t:null; }
function setField(path,value,k=cur){

  for(let i=0;i<ps.length-1;i++){ if(o[ps[i]]==null||typeof o[ps[i]]!=="object") o[ps[i]]={}; o=o[ps[i]]; }

function phaseFor(k){ let p=Store.config.phases[0]; Store.config.phases.slice().sort((a,b)=>a.from<b.from?-1:1).forEach(x=>{ if(k>=x.from) p=x; }); return p; }

function dayTargets(k=cur){ const p=phaseFor(k); const extra=hasAct("tenis",k)?(Store.config.tennisExtra||0):0; return {kcal:p.kcal+extra,P:p.P,C:p.C+Math.round(extra/4),F:p.F,name:p.name}; }
function mealTargets(m,k=cur){ const t=dayTargets(k); const P=Math.round(t.P*m.sh.P), C=Math.round(t.C*m.sh.C), F=Math.round(t.F*m.sh.F); return {P,C,F,kcal:Math.round(P*4+C*4+F*9)}; }
function itemsOf(mid,k=cur){ const d=getD(k); return (d.food&&d.food[mid])||[]; }
function sumItems(list){ return list.reduce((s,i)=>({kcal:s.kcal+(i.kcal||0),P:s.P+(i.P||0),C:s.C+(i.C||0),F:s.F+(i.F||0)}),{kcal:0,P:0,C:0,F:0}); }

function itemFrom(food,grams){ const r=grams/100; return {fid:food.id,n:food.n,g:Math.round(grams),P:+(food.p*r).toFixed(1),C:+(food.c*r).toFixed(1),F:+(food.f*r).toFixed(1),kcal:Math.round(food.k*r)}; }
function qtyText(food,grams){ const u=grams/food.ug; return `${frac(u)} ${food.u}${u>1.2&&!/s$/.test(food.u)?(/[aeiou]$/.test(food.u)?"s":"es"):""}`; }

/* ================= LECTOR DE TEXTO ("¿qué comiste?") ================= */
const NUMW={un:1,una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,media:.5,medio:.5,cuarto:.25,"un cuarto":.25,"tres cuartos":.75};
const UNITS=[
  [/^(kg|kilo|kilos|kilogramos?)$/,"kg"],[/^(g|gr|grs|gramos?)$/,"g"],[/^(ml|mililitros?)$/,"ml"],[/^(l|litros?)$/,"l"],
  [/^(tazas?|tz)$/,"taza"],[/^(vasos?)$/,"taza"],[/^(cucharadas?|cdas?)$/,"cda"],[/^(cucharaditas?|cditas?|cdtas?)$/,"cdta"],
  [/^(piezas?|pzas?|pz)$/,"pz"],[/^(rebanadas?)$/,"pz"],[/^(latas?)$/,"pz"],[/^(scoops?|medidas?)$/,"pz"],[/^(palmas?)$/,"pz"],[/^(punos?|punados?)$/,"pz"],[/^(porcion|porciones|platos?|filetes?|botellas?|claras?)$/,"pz"]
];
function parseFoodText(text){
  const foods=allFoods(); const out=[];
  const chunks=norm(text).replace(/\s+y\s+(?=(\d|un|una|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez)\b)/g,",").split(/[,;\n+]|\s+con\s+|\s+mas\s+/).map(s=>s.trim()).filter(Boolean);
  chunks.forEach(raw=>{
    let s=" "+raw+" "; let qty=null, unit=null; let half=false;
    if(/\sy medi[ao]\s/.test(s)){ half=true; s=s.replace(/\sy medi[ao]\s/," "); }
    let m=s.match(/(\d+)\s+(\d+)\/(\d+)/); if(m){ qty=+m[1]+(+m[2]/+m[3]); s=s.replace(m[0]," "); }
    if(qty==null){ m=s.match(/(\d+)\/(\d+)/); if(m){ qty=+m[1]/+m[2]; s=s.replace(m[0]," "); } }
    if(qty==null){ m=s.match(/(\d+(?:[.,]\d+)?)\s*(kg|g|gr|grs|ml|l)\b/); if(m){ qty=parseFloat(m[1].replace(",",".")); unit=m[2]==="gr"||m[2]==="grs"?"g":m[2]; s=s.replace(m[0]," "); } }
    if(qty==null){ m=s.match(/(\d+(?:[.,]\d+)?)/); if(m){ qty=parseFloat(m[1].replace(",",".")); s=s.replace(m[0]," "); } }
    if(qty==null){ for(const w of ["tres cuartos","un cuarto"].concat(Object.keys(NUMW))){ const re=new RegExp("\\s"+w+"\\s"); if(re.test(s)){ qty=NUMW[w]; s=s.replace(re," "); break; } } }
    if(half) qty=(qty==null?1:qty)+.5;
    if(!unit){ const words=s.trim().split(" "); for(let i=0;i<Math.min(2,words.length);i++){ const u=UNITS.find(([re])=>re.test(words[i])); if(u){ unit=u[1]; words.splice(i,1); s=" "+words.join(" ")+" "; break; } } }
    s=s.replace(/\s(de|del|la|el|los|las|con|sin)\s/g," ");
    let best=null, bestLen=0, bestPos=1e9;
    foods.forEach(f=>{ [f.n].concat(f.al||[]).forEach(a=>{ const al=(" "+norm(a)+" ").replace(/\s(de|del|la|el|los|las|con|sin)\s/g," ").trim(); if(!al) return;
      const re=new RegExp("(^|\\s)"+al.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(es|s)?(\\s|$)"); const mm=re.exec(s); if(!mm) return;
      const pos=mm.index; if(pos<bestPos||(pos===bestPos&&al.length>bestLen)){ best=f; bestLen=al.length; bestPos=pos; } }); });
    if(!best){ out.push({raw,unknown:true,name:raw.replace(/^\d+([.,]\d+)?\s*/,"").replace(/^(un|una|uno|dos|tres|cuatro|cinco|media|medio)\s+/,"").replace(/^(piezas?|rebanadas?|tazas?|porcion|platos?)\s+(de\s+)?/,"").trim()}); return; }
    if(qty==null) qty=1; let g;
    switch(unit){ case "kg": g=qty*1000; break; case "g": case "ml": g=qty; break; case "l": g=qty*1000; break;
      case "taza": g=qty*(best.cup||240); break; case "cda": g=qty*(best.u==="cucharada"?best.ug:15); break; case "cdta": g=qty*(best.u==="cucharadita"?best.ug:5); break; default: g=qty*best.ug; }
    out.push(Object.assign(itemFrom(best,g),{raw}));
  });
  return out;
}

/* ================= SELECTOR TIPO DIGITAL CROWN ================= */
function openCrown(o){
  // o: {title, kind, value(base), min, max, step?, units?:bool, onSave(baseValue|null)}
  let u=unitOf(o.kind); const K=UNIT_KINDS[o.kind];
  let val = o.value!=null? toDisp(o.value,o.kind,u) : (o.start!=null? toDisp(o.start,o.kind,u) : 0);
  const step=()=> o.step && u===K.opts[0][0] ? o.step : K.step[u];
  const dec=()=> Math.max(K.dec[u], (String(step()).split(".")[1]||"").length);
  const lim=v=>{ const mn=toDisp(o.min!=null?o.min:0,o.kind,u), mx=toDisp(o.max!=null?o.max:1e6,o.kind,u); return Math.min(mx,Math.max(mn,v)); };
  const ticks=[...Array(60)].map((_,i)=>{ const a=i*6*Math.PI/180, r1=i%5?96:90, r2=104; return `<line x1="${120+r1*Math.sin(a)}" y1="${120-r1*Math.cos(a)}" x2="${120+r2*Math.sin(a)}" y2="${120-r2*Math.cos(a)}" stroke="currentColor" stroke-width="${i%5?1.2:2.2}" stroke-linecap="round"/>`; }).join("");
  openModal(`<div class="crown">
    <div class="crown-t">${esc(o.title)}</div>
    <div class="crown-dial" id="cDial">
      <svg viewBox="0 0 240 240"><circle cx="120" cy="120" r="112" fill="none" style="stroke:var(--line)" stroke-width="1"/>
        <g id="cRot" style="color:var(--mut)">${ticks}<circle cx="120" cy="22" r="5" style="fill:var(--ac)"/></g></svg>
      <div class="crown-c"><input id="cIn" class="crown-num" inputmode="decimal" value=""><div class="crown-u" id="cU"></div></div>
    </div>
    <div class="mut small" style="text-align:center;margin:-4px 0 10px">Gira la rueda, desliza o escribe el número</div>
    <div class="row" style="justify-content:center;gap:10px"><button class="crown-b" id="cMinus">−</button><button class="crown-b" id="cPlus">+</button></div>
    ${K.opts.length>1&&o.units!==false?`<div class="seg" style="margin:14px auto 0;max-width:280px">${K.opts.map(x=>`<button data-cu="${x[0]}">${x[0]}</button>`).join("")}</div>`:""}
    <div class="row" style="margin-top:16px;justify-content:space-between"><button class="ghost del" id="cClr">Borrar</button><div class="row"><button id="cNo">Cancelar</button><button class="pri" id="cOk">Listo</button></div></div>
  </div>`);
  const inp=$("#cIn"), rot=$("#cRot"); let angle=0;
  const show=()=>{ inp.value=fmt(val,dec()).replace(/,/g,""); $("#cU").textContent=u; document.querySelectorAll("[data-cu]").forEach(b=>b.classList.toggle("on",b.dataset.cu===u)); rot.setAttribute("transform",`rotate(${angle} 120 120)`); };
  const bump=n=>{ const s=step(); const nv=lim(Math.round((val+n*s)/s)*s); if(nv!==val){ val=+nv.toFixed(4); angle+=n*6; if(navigator.vibrate) try{navigator.vibrate(4);}catch(e){} } show(); };
  show();
  inp.addEventListener("input",()=>{ const n=num(inp.value); if(n!=null) val=n; });
  inp.addEventListener("focus",()=>inp.select());
  $("#cMinus").onclick=()=>bump(-1); $("#cPlus").onclick=()=>bump(1);
  const dial=$("#cDial"); let last=null, acc=0;
  const ang=e=>{ const r=dial.getBoundingClientRect(); return Math.atan2(e.clientX-(r.left+r.width/2), -(e.clientY-(r.top+r.height/2)))*180/Math.PI; };
  dial.addEventListener("pointerdown",e=>{ if(e.target===inp) return; last=ang(e); acc=0; dial.setPointerCapture(e.pointerId); });
  dial.addEventListener("pointermove",e=>{ if(last==null) return; let a=ang(e), d=a-last; if(d>180) d-=360; if(d<-180) d+=360; last=a; acc+=d; while(Math.abs(acc)>=12){ const s=Math.sign(acc); bump(s); acc-=s*12; } });
  dial.addEventListener("pointerup",()=>{ last=null; });
  dial.addEventListener("wheel",e=>{ e.preventDefault(); bump(e.deltaY<0?1:-1); },{passive:false});
  document.querySelectorAll("[data-cu]").forEach(b=>b.onclick=()=>{ const base=toBase(val,o.kind,u); u=b.dataset.cu; Store.config.units=Store.config.units||{}; Store.config.units[o.kind]=u; saveConfig(); val=toDisp(base,o.kind,u); show(); });
  $("#cNo").onclick=closeModal;
  $("#cClr").onclick=()=>{ closeModal(); o.onSave(null); };
  $("#cOk").onclick=()=>{ const n=num(inp.value); if(n!=null) val=lim(n); closeModal(); o.onSave(+toBase(val,o.kind,u).toFixed(4)); };
}

const MAIN_OPTS={P:["pollo","huevo","atun","res","pescado","whey","panela"],C:["tortilla","arroz","pasta","bolillo","panint","avena","papa","frijol","platano"],F:["aceite","cacahuatecrema","cacahuate","nuez","aguacate"]};
function optRow(f,grams){ return `<tr><td>${esc(f.n)}${f.id.startsWith("u")?' <span class="pill">tuyo</span>':""}</td><td>${qtyText(f,grams)}<div class="mut">${Math.round(grams)} g</div></td><td style="width:44px"><button class="add" data-optadd="${f.id}" data-gr="${Math.round(grams)}">+</button></td></tr>`; }
function optGroup(g,label,need,key){
  const foods=allFoods().filter(f=> g==="C"? (f.g==="C") : g==="P"? (f.g==="P"&&f.p>=8) : (f.g==="F"));
  let rows=`<tr class="grp"><td colspan="3">${label} · necesitas ${fmt(need,0)} g</td></tr>`;
  if(need<2) return rows+`<tr><td colspan="3" class="mut">Ya está cubierto.</td></tr>`;
  const main=[], more=[];
  foods.forEach(f=>{ const per=f[key]; if(!per) return; const grams=need/per*100; if(grams>900) return;
    (f.id.startsWith("u")||MAIN_OPTS[g].includes(f.id)?main:more).push(optRow(f,grams)); });
  rows+=main.join("");
  if(more.length) rows+=`<tr><td colspan="3" style="text-align:left"><details><summary>Ver ${more.length} opciones más</summary><table class="tbl">${more.join("")}</table></details></td></tr>`;
  return rows;
}
function optVeg(){
  let rows=`<tr class="grp"><td colspan="3">Verduras · libres, 1 a 2 tazas</td></tr>`;
  allFoods().filter(f=>f.g==="V"&&["nopal","calabacita","brocoli","ejote","lechuga"].includes(f.id)||f.g==="V"&&f.id.startsWith("u")).forEach(f=>{ const grams=f.cup||f.ug; rows+=`<tr><td>${esc(f.n)}</td><td>1 taza<div class="mut">${Math.round(grams)} g</div></td><td style="width:44px"><button class="add" data-optadd="${f.id}" data-gr="${Math.round(grams)}">+</button></td></tr>`; });
  return rows;
}

function countSets(w){ return (w.ex||[]).reduce((s,e)=>s+(e.sets||[]).filter(x=>x.r!=null&&x.r!=="").length,0); }
function lastSessions(name,before,n=2){ const ks=Object.keys(Store.days).filter(k=>k<before).sort().reverse(); const out=[];
  for(const k of ks){ const w=Store.days[k].workout; if(!w||!w.ex) continue; const e=w.ex.find(x=>x.n===name); if(e&&e.sets&&e.sets.some(s=>s.r!=null&&s.r!=="")){ out.push({k,e}); if(out.length>=n) break; } } return out; }
function progressHint(tEx,hist){
  if(!hist.length) return {cls:"keep",t:"Primera vez: elige un peso con el que te sobren 3 repeticiones."};
  const sets=(hist[0].e.sets||[]).filter(s=>s.r!=null&&s.r!==""); if(!sets.length) return null;
  const allTop=sets.every(s=>Number(s.r)>=tEx.hi&&(s.rir==null||s.rir===""||Number(s.rir)>=1));
  const missLow=h=>(h.e.sets||[]).filter(s=>s.r!=null&&s.r!=="").some(s=>Number(s.r)<tEx.lo);
  const lastW=Math.max(...sets.map(s=>num(s.w)||0));
  if(allTop){ const inc=tEx.u==="kg"?(/sentadilla|muerto/i.test(tEx.n)?5:(/barra|militar|banca/i.test(tEx.n)?2.5:null)):null;
    return {cls:"up",t: inc? `Sube a ${fmt(lastW+inc)} kg` : tEx.u==="kg"?"Sube al siguiente peso de mancuerna":tEx.u==="seg"?"Sube 5 segundos":"Sube 1 repetición o de nivel"}; }
  if(hist.length>=2&&missLow(hist[0])&&missLow(hist[1])) return {cls:"down",t:`Baja ~10%${lastW?" → "+fmt(lastW*.9)+" kg":""}`};
  return {cls:"keep",t:`Mantén ${lastW?fmt(lastW)+" kg":"el peso"} y suma repeticiones`};
}

}

function build3D(){
  const T=THREE; const scene=new T.Scene();
  const cam=new T.PerspectiveCamera(30,1,.1,20); cam.position.set(0,0.93,3.7); cam.lookAt(0,0.91,0);
  scene.add(new T.HemisphereLight(0xe6ecff,0x15181e,0.75));
  const key=new T.DirectionalLight(0xffffff,0.85); key.position.set(1.6,2.4,2.6); scene.add(key);
  const fill=new T.DirectionalLight(0x9fb4ff,0.35); fill.position.set(-2.2,1.2,1.4); scene.add(fill);
  const rim=new T.DirectionalLight(0xffffff,0.45); rim.position.set(0,1.8,-3); scene.add(rim);
  const root=new T.Group(); scene.add(root);
  const V=(x,y,z)=>new T.Vector3(x,y,z);
  const mat=new T.ShaderMaterial({vertexColors:true,transparent:true,depthWrite:false,blending:T.AdditiveBlending,uniforms:{uTime:{value:0}},
    vertexShader:"varying vec3 vC;varying vec3 vN;varying vec3 vV;varying float vY;void main(){vC=color;vec4 mv=modelViewMatrix*vec4(position,1.0);vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);vY=position.y;gl_Position=projectionMatrix*mv;}",
    fragmentShader:"uniform float uTime;varying vec3 vC;varying vec3 vN;varying vec3 vV;varying float vY;void main(){float f=pow(1.0-abs(dot(normalize(vN),normalize(vV))),2.0);float scan=0.82+0.18*sin(vY*160.0-uTime*3.0);float band=smoothstep(0.06,0.0,abs(vY-mod(uTime*0.35,2.1)+0.15));vec3 col=vC*(0.45+1.25*f)*scan+vec3(0.15,0.75,0.95)*(0.35*f+0.6*band);gl_FragColor=vec4(col,0.3+0.65*f);}"});
  M3.mat=mat;
  const g=(x,mu,s)=>Math.exp(-((x-mu)*(x-mu))/(2*s*s));
  // interpolación suave entre claves [t, ...valores]
  const interp=(keys,t)=>{ if(t<=keys[0][0]) return keys[0].slice(1); const L=keys[keys.length-1]; if(t>=L[0]) return L.slice(1);
    for(let i=0;i<keys.length-1;i++){ const a=keys[i],b=keys[i+1]; if(t>=a[0]&&t<=b[0]){ let u=(t-a[0])/(b[0]-a[0]); u=u*u*(3-2*u); return a.slice(1).map((v,k)=>v+(b[k+1]-v)*u); } } };
  M3.parts=[];
  // Malla en rejilla (u = a lo largo, v = alrededor). Colores por cara => divisiones nítidas
  function gridMesh(rows,cols,posFn,regFn,flip){
    const pos=[],idx=[];
    for(let i=0;i<=rows;i++) for(let j=0;j<=cols;j++){ const p=posFn(i/rows,j/cols); pos.push(p.x,p.y,p.z); }
    const W=cols+1;
    for(let i=0;i<rows;i++) for(let j=0;j<cols;j++){ const a=i*W+j,b=a+1,c=a+W,d=c+1;
      if(flip){ idx.push(a,b,c, b,d,c); } else { idx.push(a,c,b, b,c,d); } }
    let geo=new T.BufferGeometry(); geo.setAttribute("position",new T.Float32BufferAttribute(pos,3)); geo.setIndex(idx); geo.computeVertexNormals();
    // unir normales de la costura
    const n=geo.attributes.normal; for(let i=0;i<=rows;i++){ const a=i*W, b=i*W+cols; const v=V(n.getX(a)+n.getX(b),n.getY(a)+n.getY(b),n.getZ(a)+n.getZ(b)).normalize(); n.setXYZ(a,v.x,v.y,v.z); n.setXYZ(b,v.x,v.y,v.z); }
    const reg=[]; for(let i=0;i<rows;i++) for(let j=0;j<cols;j++) reg.push(regFn?regFn((i+.5)/rows,(j+.5)/cols):null);
    const border=reg.map((r,k)=>{ const i=Math.floor(k/cols), j=k%cols; const nb=[[i-1,j],[i+1,j],[i,(j+1)%cols],[i,(j-1+cols)%cols]];
      return nb.some(([a,b])=>a>=0&&a<rows&&reg[a*cols+b]!==r); });
    geo=geo.toNonIndexed(); const cnt=geo.attributes.position.count; geo.setAttribute("color",new T.Float32BufferAttribute(new Float32Array(cnt*3),3));
    const faceReg=[], faceBorder=[]; for(let k=0;k<reg.length;k++){ faceReg.push(reg[k],reg[k]); faceBorder.push(border[k],border[k]); }
    const mesh=new T.Mesh(geo,mat); mesh.userData.faceReg=faceReg; mesh.userData.faceBorder=faceBorder; root.add(mesh); M3.parts.push(mesh); return mesh;
  }
  // ---------- TORSO ----------
  // y, mitad del ancho, profundidad frontal, profundidad dorsal
  const TK=[[0.835,.125,.075,.080],[0.88,.153,.092,.104],[0.95,.160,.100,.112],[1.02,.147,.104,.092],[1.08,.139,.108,.088],[1.15,.147,.112,.092],
            [1.22,.166,.118,.103],[1.30,.182,.126,.105],[1.37,.188,.112,.101],[1.42,.174,.088,.094],[1.46,.124,.062,.074],[1.49,.074,.052,.060],[1.515,.058,.048,.050]];
  const y0=.835,y1=1.515;
  function torsoBump(y,x,front,th){ let b=0; const ax=Math.abs(x);
    if(front){ b+=.02*g(ax,.088,.052)*g(y,1.318,.05);                       // pectorales
      b-=.004*g(x,0,.008)*(y>1.22&&y<1.43?1:0);                               // esternón
      if(y>.95&&y<1.235&&ax<.08){ b+=.004; b-=.0045*g(x,0,.007); [1.075,1.135,1.195].forEach(h=>b-=.003*g(y,h,.007)); } // abdominales
      b+=.004*g(ax,.13,.02)*g(y,1.05,.05);                                   // oblicuos
    } else {
      b+=.02*g(Math.abs(th),2.0,.4)*g(y,1.25,.09);                         // dorsales
      b+=.006*g(ax,.036,.014)*g(y,1.08,.08)-.006*g(x,0,.01)*(y>.97&&y<1.44?1:0); // erectores y columna
      b+=.008*g(ax,.075,.035)*g(y,1.33,.04);                                  // omóplatos
      b+=.03*g(ax,.078,.06)*g(y,.915,.055)-.012*g(x,0,.009)*(y<.97?1:0);     // glúteos
    }
    return b; }
  function torsoPos(u,v){ const y=y0+(y1-y0)*u; const th=v*2*Math.PI-Math.PI; const [w,dF,dB]=interp(TK,y);
    const front=Math.cos(th)>=0; const d=front?dF:dB; let x=w*Math.sin(th), z=d*Math.cos(th);
    const n=V(x/(w*w),0,z/(d*d)).normalize(); const b=torsoBump(y,x,front,th); return V(x+n.x*b,y,z+n.z*b); }
  function torsoReg(u,v){ const y=y0+(y1-y0)*u; const th=v*2*Math.PI-Math.PI; const a=Math.abs(th); const w=interp(TK,y)[0]; const x=Math.abs(Math.sin(th))*w;
    if(y>1.445) return a>1.05?"trapecio":null;
    if(a<Math.PI/2){
      if(y>=1.235+.07*Math.pow(x/.17,2)&&y<=1.425&&x>.012&&a<1.35) return "pecho";
      if(y>=1.2&&y<1.40&&a>=1.3) return "dorsal";
      if(y<1.235&&y>.93&&x<.073&&a<.62) return "abdomen";
      if(y<1.235&&y>.93) return "oblicuos";
      if(y<=.93&&y>.89&&x<.055) return "abdomen";
      if(y<.99&&a>1.25) return "gluteos";
      return null;
    }
    if(y>=1.38) return "trapecio";
    if(y>=1.22&&x<.10&&a>2.0) return "espMedia";
    if(y>=1.12&&y<1.22&&x<.035) return "espMedia";
    if(y>=.97&&y<1.12&&x<.05&&a>2.3) return "espBaja";
    if(y>=1.02&&y<1.38) return "dorsal";
    if(y<1.0) return "gluteos";
    return "espBaja";
  }
  gridMesh(90,96,torsoPos,torsoReg,true);
  // ---------- CUELLO Y CABEZA ----------
  gridMesh(14,40,(u,v)=>{ const y=1.48+.15*u, th=v*2*Math.PI-Math.PI; const r=.063-.009*u; return V(r*Math.sin(th),y,.008*u+r*.92*Math.cos(th)); },

function pick(e){
  const T=THREE; const el=M3.renderer.domElement; const r=el.getBoundingClientRect();

  const h=hits[0]; mSel = h&&h.faceIndex!=null? (h.object.userData.faceReg[h.faceIndex]||null) : null; render();
}
function paint3D(A){

  M3.parts.forEach(mesh=>{ const ca=mesh.geometry.attributes.color; const fr=mesh.userData.faceReg, fb=mesh.userData.faceBorder;
    for(let f=0;f<fr.length;f++){ const k=fr[f]; let c= k&&cols[k]? cols[k] : skin; if(k&&fb[f]) c=c.clone().lerp(line,.45);

}

function exMuscles(name){ const m=Store.config.exMap&&Store.config.exMap[name]; if(m) return m; for(const [re,map] of EX_RULES) if(re.test(name)) return map; return {}; }
const doneSets=e=>(e.sets||[]).filter(s=>s.r!=null&&s.r!=="");
const setEff=s=>{ const r=num(s.rir); return r!=null&&r>=5?.5:1; };
const setInt=s=>{ const r=num(s.rir); if(r==null) return 1; return r<=0?1.2:r===1?1.1:r===2?1:r===3?.9:.75; };
const zero=()=>{ const o={}; MK.forEach(k=>o[k]=0); return o; };
function loadBetween(from,to,actW=.5){
  const o=zero();
  for(const k in Store.days){ if(k<from||k>to) continue; const d=migrateDay(Store.days[k]);
    if(d.workout&&d.workout.ex) d.workout.ex.forEach(e=>{ const map=exMuscles(e.n); doneSets(e).forEach(s=>{ const ef=setEff(s); for(const m in map) if(o[m]!=null) o[m]+=map[m]*ef; }); });
    (d.acts||[]).forEach(a=>{ const map=ACT_MAP[a.t]; const mins=num(a.min); if(map&&mins) for(const m in map) o[m]+=map[m]*mins/30*actW; });
  }
  return o;
}
const TAU={L:40,M:32,S:26};
function fatigueAt(refKey){
  const today=iso(new Date()); const ref=refKey===today?new Date():(()=>{const d=parseISO(refKey); d.setHours(21,0,0,0); return d;})();
  const F=zero();
  for(let i=0;i<8;i++){ const k=addDays(refKey,-i); const d=migrateDay(Store.days[k]); if(!d) continue; const base=parseISO(k);
    if(d.workout&&d.workout.ex){ const t=new Date(base); t.setHours(8,0,0,0); const h=(ref-t)/36e5; if(h>=0) d.workout.ex.forEach(e=>{ const map=exMuscles(e.n); doneSets(e).forEach(s=>{ const it=setInt(s); for(const m in map) if(F[m]!=null) F[m]+=map[m]*it*Math.exp(-h/TAU[MUSCLES[m].sz]); }); }); }
    (d.acts||[]).forEach(a=>{ const map=ACT_MAP[a.t]; const mins=num(a.min); if(!map||!mins) return; const t=new Date(base); t.setHours(ACTS[a.t].h||19,0,0,0); const h=(ref-t)/36e5; if(h>=0) for(const m in map) F[m]+=map[m]*mins/30*Math.exp(-h/TAU[MUSCLES[m].sz]); });
  }
  const o={}; MK.forEach(m=>o[m]=Math.min(100,Math.round(F[m]/8*100))); return o;
}

    if((d.acts||[]).some(a=>num(a.min)&&ACT_MAP[a.t]&&(ACT_MAP[a.t][m]||0)>=1)) return k; } return null; }

  for(let k=addDays(fromKey,1);k<=sun;k=addDays(k,1)){ const t=strengthOf(k); const d=Store.days[k]; if(!t||(d&&d.workout&&d.workout.ex&&countSets(d.workout))) continue;
    sessions.push({k,t}); (Store.config.templates[t]||[]).forEach(e=>{ const map=exMuscles(e.n); for(const m in map) if(o[m]!=null) o[m]+=map[m]*e.s; }); }
  return {o,sessions}; }

function analysis(){
  const mon=mondayOf(cur), sun=addDays(mon,6);

function recs(A){
  const R=[]; const by=k=>A.rows.find(r=>r.m===k); const next=A.plan.sessions[0];

    R.push({lvl:2,m:r.m,t:`${r.M.n} terminaría la semana al ${r.projPct}%. Es prioridad para tu físico objetivo: agrega ${add} serie${add>1?"s":""}${b?" de "+b.n:""}${next?" el "+DOWL[parseISO(next.k).getDay()].toLowerCase():" la próxima semana"}.`}); });
  A.rows.filter(r=>!r.M.prio&&r.projPct<60).forEach(r=>{ const b=bestEx(r.m); R.push({lvl:1,m:r.m,t:`${r.M.n} va al ${r.projPct}% de su meta semanal.${b?" Agrega 2 series de "+b.n+".":""}`}); });

  if(push+pull>6&&pull<push) R.push({lvl:1,t:`Haces más empuje (${fmt(push,0)} series) que jalón (${fmt(pull,0)}). Para la espalda en V y la postura, el jalón debe igualar o superar al empuje.`});
  if(by("deltF").week>4&&by("deltP").week<by("deltF").week*.6) R.push({lvl:1,m:"deltP",t:"El hombro posterior va muy por debajo del frontal. Agrega face pulls o pájaros."});

function allWeeks(){ const ks=Object.keys(Store.days).sort(); let s=mondayOf(Store.config.start||cur); if(ks[0]&&ks[0]<s) s=mondayOf(ks[0]); const out=[]; for(let m=s;m<=mondayOf(cur);m=addDays(m,7)) out.push(m); return out; }

  const fd=ks.map(k=>Store.days[k]&&dayFood(k)).filter(x=>x&&x.n); let sets=0,reps=0,ton=0,actMin=0; const ex={};
  ds.forEach(d=>{ if(d.workout&&d.workout.ex) d.workout.ex.forEach(e=>doneSets(e).forEach(s=>{ const r=num(s.r)||0,w=num(s.w)||0; sets++; reps+=r; ton+=w*r; const E=ex[e.n]=ex[e.n]||{sets:0,reps:0,best:null}; E.sets++; E.reps+=r; const e1=w?w*(1+r/30):r; if(!E.best||e1>E.best.e1) E.best={w,r,e1}; }));

const ACTS_BASE=JSON.parse(JSON.stringify(ACTS)), ORDER_BASE=ACT_ORDER.slice();
function rebuildActs(){
  const c=Store.config; Object.keys(ACTS).forEach(k=>delete ACTS[k]); Object.assign(ACTS,clone(ACTS_BASE));
  (c.customActs||[]).forEach(a=>{ ACTS[a.id]={n:a.n,k:a.k,h:19,custom:true,hidden:!!a.hidden}; });
  const nm=c.actNames||{}; for(const k in nm) if(ACTS[k]&&nm[k]&&!ACTS[k].custom) ACTS[k].n=nm[k];
  const vis=(c.customActs||[]).filter(a=>!a.hidden); const cs=vis.filter(a=>a.k==="fuerza").map(a=>a.id), co=vis.filter(a=>a.k!=="fuerza").map(a=>a.id);
  const ord=[]; ORDER_BASE.forEach(k=>{ if(k==="otro") ord.push(...co); ord.push(k); if(k==="C") ord.push(...cs); });
  ACT_ORDER.length=0; ACT_ORDER.push(...ord);
}

}

  [/aceite|nuez|almendra|cacahuate|mani|aguacate|mantequilla|mayonesa|crema|semilla|chia|linaza|tocino/,"F"],
  [/lechuga|espinaca|brocoli|calabac|nopal|ejote|pepino|jitomate|tomate|zanahoria|chile|cebolla|champi|coliflor|apio|verdura|ensalada/,"V"],

function guessGroup(name,P,C,F){
  const tot=(P||0)*4+(C||0)*4+(F||0)*9;
  if(tot>0){ const per100=tot; if(per100<45&&(C||0)>=(P||0)&&(F||0)<2) return "V"; if((P||0)*4/tot>=.4) return "P"; if((F||0)*9/tot>=.6) return "F"; return "C"; }
  const n=norm(name||""); for(const [re,g] of NAME_HINTS) if(re.test(n)) return g; return n?"C":null;
}

function lineChart(pts,label,unit,color){
  const vals=pts.filter(p=>p.v!=null); if(vals.length<2) return `<div class="mut">Con 2 semanas de ${label.toLowerCase()} aparece la gráfica.</div>`;
  const W=360,H=150,pl=34,pr=10,pt=10,pb=22; let mn=Math.min(...vals.map(p=>p.v)),mx=Math.max(...vals.map(p=>p.v)); if(mx-mn<1){mn-=.5;mx+=.5;}
  const xs=i=>pl+(W-pl-pr)*(pts.length===1?0:i/(pts.length-1)), ys=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  let path="",area=""; pts.forEach((p,i)=>{ if(p.v==null) return; path+=(path?"L":"M")+xs(i).toFixed(1)+" "+ys(p.v).toFixed(1); });
  const first=pts.findIndex(p=>p.v!=null), last=pts.length-1-[...pts].reverse().findIndex(p=>p.v!=null);
  area=path+`L${xs(last)} ${H-pb}L${xs(first)} ${H-pb}Z`;
  let g=`<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="gr${label.replace(/\W/g,"")}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${color};stop-opacity:.25"/><stop offset="1" style="stop-color:${color};stop-opacity:0"/></linearGradient></defs>`;
  [mn,(mn+mx)/2,mx].forEach(v=>g+=`<line x1="${pl}" x2="${W-pr}" y1="${ys(v)}" y2="${ys(v)}" style="stroke:var(--line)"/><text x="${pl-5}" y="${ys(v)+4}" style="fill:var(--mut)" font-size="10" text-anchor="end">${fmt(v)}</text>`);
  g+=`<path d="${area}" fill="url(#gr${label.replace(/\W/g,"")})"/><path d="${path}" fill="none" style="stroke:${color}" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{ if(p.v!=null) g+=`<circle cx="${xs(i)}" cy="${ys(p.v)}" r="3.2" style="fill:${color}"/>`; if(i%Math.ceil(pts.length/6)===0||i===pts.length-1) g+=`<text x="${xs(i)}" y="${H-6}" style="fill:var(--mut)" font-size="10" text-anchor="middle">${p.l}</text>`; });
  return g+`</svg><div class="mut">${label} · promedio semanal (${unit})</div>`;
}
function calorieAdvice(weeks){
  const f=weeks.filter(w=>w.w!=null); if(f.length<3) return "Con 3 semanas de peso registrado te digo si conviene ajustar calorías.";
  const [a,b,c]=f.slice(-3); const d1=b.w-a.w,d2=c.w-b.w; const cut=/1|defin/i.test(phaseFor(addDays(c.mon,6)).name);
  if(cut){ if(d1>-.2&&d2>-.2) return "Llevas 2 semanas bajando menos de 0.2 kg: quita ~150 kcal (1 porción de carbohidrato en la cena)."; if(d1<-.8&&d2<-.8) return "Bajas más de 0.8 kg por semana: suma ~200 kcal."; return "Vas en rango (−0.2 a −0.8 kg por semana). Mantén las calorías."; }
  if(d1>.5&&d2>.5) return "Subes más de 0.5 kg por semana: quita ~150 kcal."; if(d1<-.25&&d2<-.25) return "Estás bajando en recomposición: suma ~150 kcal."; return "Peso estable: es lo esperado en recomposición. Fíjate en la cintura y la fuerza.";
}
function bestOf(name){ let b=null; for(const k of Object.keys(Store.days).sort()){ const w=Store.days[k].workout; if(!w||!w.ex) continue; const e=w.ex.find(x=>x.n===name); if(!e) continue;
  e.sets.forEach(s=>{ const r=num(s.r),wt=num(s.w)||0; if(r==null) return; const e1=wt?wt*(1+r/30):r; if(!b||e1>b.e1) b={k,w:wt,r,e1}; }); } return b; }

      onSave:v=>{ if(v==null) delete s[f]; else s[f]=f==="w"?+v.toFixed(2):Math.round(v); if(f==="r"&&v!=null&&s.rir==null&&c.show.rir) s.rir=2; saveDay(); render(); }}); });
  // Hoy
  on("[data-act]","click",el=>toggleAct(el.dataset.act));
  on("[data-st]","change",el=>{ setField(el.dataset.st,el.value||null); const d=getD(); if(d.bed&&d.wake){ const [bh,bm]=d.bed.split(":").map(Number),[wh,wm]=d.wake.split(":").map(Number); let m=(wh*60+wm)-(bh*60+bm); if(m<=0) m+=1440; setField("sleep",+(m/60).toFixed(2)); } render(); });
  on("[data-q]","click",el=>{ const p=el.dataset.q, v=+el.dataset.v; setField(p,getPath(p)===v?null:v); const was=el.classList.contains("on"); el.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("on")); if(!was) el.classList.add("on"); if(p==="p5") render(); });
  on("[data-qc]","click",el=>{ const p=el.dataset.qc, v=el.dataset.v; setField(p,getPath(p)===v?null:v); render(); });
  on("[data-qm]","click",el=>{ const p=el.dataset.qm, v=el.dataset.v; let a=(getPath(p)||[]).slice(); a=a.includes(v)?a.filter(x=>x!==v):a.concat([v]); setField(p,a.length?a:null); render(); });
  on("[data-arpe]","click",el=>{ const i=+el.dataset.arpe, v=+el.dataset.v; const d=day(cur,true); d.acts[i].rpe=d.acts[i].rpe===v?undefined:v; saveDay(); render(); });
  on("[data-cool]","click",el=>{ const i=+el.dataset.cool; const d=day(cur,true); d.acts[i].cool=d.acts[i].cool?undefined:true; saveDay(); render(); });
  on("[data-yoga]","click",()=>{ const y=getD().yoga||{}; setField("yoga.done",y.done?null:true); render(); });
  on("[data-tog]","click",el=>{ const p=el.dataset.tog; setField(p,getPath(p)?null:true); render(); });
  on("[data-go]","click",el=>{ tab=el.dataset.go; render(); scrollTo(0,0); });
  // Comida
  on("[data-meal]","click",el=>{ meal=el.dataset.meal; render(); });
  on("[data-idel]","click",el=>{ const d=day(cur,true); d.food[meal].splice(+el.dataset.idel,1); saveDay(); render(); });
  on("[data-optadd]","click",el=>{ const f=allFoods().find(x=>x.id===el.dataset.optadd); const g=+el.dataset.gr; addItem(Object.assign(itemFrom(f,g),{q:qtyText(f,g)})); toast(f.n+" agregado"); render(); });
  [["#newFood"],["#newFood2"]].forEach(([s])=>{ const b=$(s); if(b) b.onclick=()=>foodModal(); });
  on("[data-fedit]","click",el=>{ const f=c.foods.find(x=>x.id===el.dataset.fedit); foodModal(Object.assign({},f,{mode:"100",al:(f.al||[]).filter(a=>a!==f.n)})); });
  const fc=$("#fcalc"); if(fc) fc.onclick=()=>{ const txt=$("#ftext").value; if(!txt.trim()) return; showParse(parseFoodText(txt)); };
  // Entreno
  on("[data-tplsel]","click",el=>{ const v=el.dataset.tplsel; const d=day(cur,true); if(d.workout&&d.workout.ex&&countSets(d.workout)>0){ d.workout.tpl=v; } else d.workout={tpl:v}; saveDay(); render(); });
  const sw=$("#startW"); if(sw) sw.onclick=()=>{ const d=day(cur,true); const t=(d.workout&&d.workout.tpl)||strengthOf()||"A"; const list=t==="libre"?[]:(c.templates[t]||[]);
    d.workout=Object.assign(d.workout||{},{tpl:t,ex:list.map(e=>{ const h=lastSessions(e.n,cur,1)[0]; return {n:e.n,u:e.u,sets:[...Array(Math.max(1,e.s))].map((_,i)=>{ const p=h&&(h.e.sets[i]||h.e.sets[h.e.sets.length-1]); return p&&p.w!=null?{w:p.w}:{}; })}; })});
    if(t!=="libre"&&!d.acts.some(a=>a.t===t)){ d.acts=d.acts.filter(a=>ACTS[a.t].k!=="fuerza"&&a.t!=="descanso"); d.acts.push({t}); } saveDay(); render(); };
  on("[data-exn]","change",el=>{ day(cur,true).workout.ex[+el.dataset.exn].n=el.value.trim()||"Ejercicio"; saveDay(); render(); });
  on("[data-exdel]","click",el=>confirmBox("¿Quitar este ejercicio de hoy?",()=>{ day(cur,true).workout.ex.splice(+el.dataset.exdel,1); saveDay(); render(); }));
  on("[data-setadd]","click",el=>{ const e=day(cur,true).workout.ex[+el.dataset.setadd]; const l=e.sets[e.sets.length-1]||{}; e.sets.push(l.w!=null?{w:l.w}:{}); saveDay(); render(); });
  on("[data-setdel]","click",el=>{ const [ei,si]=el.dataset.setdel.split(".").map(Number); day(cur,true).workout.ex[ei].sets.splice(si,1); saveDay(); render(); });
  on("[data-copy]","click",el=>{ const e=day(cur,true).workout.ex[+el.dataset.copy]; const h=lastSessions(e.n,cur,1)[0]; if(!h) return; e.sets.forEach((s,i)=>{ const p=h.e.sets[i]; if(p&&p.w!=null) s.w=p.w; }); saveDay(); render(); });
  const ae=$("#addEx"); if(ae) ae.onclick=()=>{ day(cur,true).workout.ex.push({n:"Nuevo ejercicio",u:"kg",sets:[{},{},{}]}); saveDay(); render(); };
  const cw=$("#clearW"); if(cw) cw.onclick=()=>confirmBox("¿Borrar toda la sesión de este día?",()=>{ setField("workout",null); render(); });
  // Cuerpo
  on("[data-bmode]","click",el=>{ bMode=el.dataset.bmode; render(); });
  on("[data-msel]","click",(el,e)=>{ e.preventDefault(); mSel=el.dataset.msel||null; render(); if(mSel){ const hc=document.querySelector(".holo-card"); if(hc) hc.scrollIntoView({behavior:"smooth",block:"start"}); } });
  on("[data-view]","click",el=>{ const v=el.dataset.view; if(v==="spin"){ M3.auto=!M3.auto; el.textContent=M3.auto?"Detener":"Girar"; return; } M3.auto=false; M3.rotY=v==="front"?0:v==="back"?Math.PI:Math.PI/2; M3.tiltX=.04; });
  on("[data-exmap]","click",el=>exMapEditor(el.dataset.exmap));
  const gs=$("#gSearch"); if(gs) gs.addEventListener("input",()=>{ gQ=gs.value; const g=document.createElement("div"); g.innerHTML=viewGlossary(); $("#gBody").innerHTML=g.querySelector("#gBody").innerHTML; });
  on("[data-gcat]","click",el=>{ gCat=el.dataset.gcat; const y=scrollY; render(); scrollTo(0,y); });
  if(tab==="cuerpo"){ mount3D(); if(M3.ready&&M3.lastA) paint3D(M3.lastA); }
  // Ajustes
  on("[data-theme]","click",el=>{ c.theme=el.dataset.theme; saveConfig(); render(); });
  on("[data-unit]","click",el=>{ const [k,u]=el.dataset.unit.split("."); c.units=c.units||{}; c.units[k]=u; saveConfig(); render(); });
  on("[data-mx]","click",el=>{ const [dw,k]=el.dataset.mx.split("."); let a=wkEdit[dw];
    const commit=()=>{ if(!a.length) a=["descanso"]; wkEdit[dw]=a; render(); };
    if(a.includes(k)){ a=a.filter(x=>x!==k); if(k==="otro") delete wkTxt[dw]; return commit(); }
    const add=()=>{ if(k==="descanso") a=[]; else a=a.filter(x=>x!=="descanso"); if(ACTS[k].k==="fuerza") a=a.filter(x=>ACTS[x].k!=="fuerza"); a.push(k); commit(); };
    if(k==="otro") otherTextModal(wkTxt[dw],txt=>{ wkTxt[dw]=txt; add(); }); else add(); });
  on("[data-otxt]","click",el=>{ const dw=el.dataset.otxt; otherTextModal(wkTxt[dw],txt=>{ wkTxt[dw]=txt; render(); }); });
  const wa=$("#wkApply"); if(wa) wa.onclick=()=>{ c.week=clone(wkEdit); c.weekTxt=clone(wkTxt); saveConfig(); toast("Semana aplicada"); render(); };
  const ws=$("#wkSave"); if(ws) ws.onclick=()=>{ openModal(`<h3 style="margin-top:0">Guardar semana</h3><label class="f">Nombre<input id="pn" maxlength="40" placeholder="Semana con box"></label><div class="row end" style="margin-top:12px"><button id="pN">Cancelar</button><button class="pri" id="pO">Guardar</button></div>`);
    $("#pN").onclick=closeModal; $("#pO").onclick=()=>{ const n=$("#pn").value.trim()||"Mi semana"; c.presets.push({id:"p"+uid(),n,week:clone(wkEdit),txt:clone(wkTxt)}); c.week=clone(wkEdit); c.weekTxt=clone(wkTxt); saveConfig(); closeModal(); toast("Semana guardada y aplicada"); render(); }; };
  on("[data-pload]","click",el=>{ const p=c.presets.find(x=>x.id===el.dataset.pload); wkEdit=clone(p.week); wkTxt=clone(p.txt||{}); c.week=clone(p.week); c.weekTxt=clone(p.txt||{}); saveConfig(); toast("Usando: "+p.n); render(); });
  on("[data-pdel]","click",el=>confirmBox("¿Borrar esta semana guardada?",()=>{ c.presets=c.presets.filter(x=>x.id!==el.dataset.pdel); saveConfig(); render(); }));
  on("[data-ph]","change",el=>{ const [i,f]=el.dataset.ph.split("."); c.phases[+i][f]=["kcal","P","C","F"].includes(f)?(num(el.value)||0):el.value; saveConfig(); });
  const ap=$("#addPh"); if(ap) ap.onclick=()=>{ const l=c.phases[c.phases.length-1]; c.phases.push(Object.assign({},l,{from:addDays(l.from,28),name:"Nueva fase"})); saveConfig(); render(); };
  const dp=$("#delPh"); if(dp) dp.onclick=()=>{ c.phases.pop(); saveConfig(); render(); };
  on("[data-cfg]","change",el=>{ c[el.dataset.cfg]=el.dataset.num!==undefined?(num(el.value)||0):el.value; saveConfig(); });
  on("[data-goal]","change",el=>{ c.goals[el.dataset.goal]=num(el.value)||0; saveConfig(); });
  on("[data-show]","click",el=>{ c.show[el.dataset.show]=!c.show[el.dataset.show]; saveConfig(); render(); });
  on("[data-met]","change",el=>{ const [i,f]=el.dataset.met.split("."); c.metrics[+i][f]=el.value; saveConfig(); });
  on("[data-metdel]","click",el=>{ c.metrics.splice(+el.dataset.metdel,1); saveConfig(); render(); });
  const am=$("#addMet"); if(am) am.onclick=()=>{ c.metrics.push({id:"m"+uid(),name:"Nueva métrica",type:"number"}); saveConfig(); render(); };
  on("[data-meal-e]","change",el=>{ const [i,f]=el.dataset.mealE.split("."); c.meals[+i][f]=el.value; saveConfig(); });
  on("[data-tpl]","change",el=>{ const [t,i,f]=el.dataset.tpl.split("."); c.templates[t][+i][f]=f==="n"?el.value:(num(el.value)||0); saveConfig(); });
  on("[data-tpldel]","click",el=>{ const [t,i]=el.dataset.tpldel.split("."); c.templates[t].splice(+i,1); saveConfig(); render(); });
  on("[data-tpladd]","click",el=>{ c.templates[el.dataset.tpladd].push({n:"Nuevo ejercicio",s:3,lo:8,hi:12,u:"kg"}); saveConfig(); render(); });
  const rt=$("#resetTpl"); if(rt) rt.onclick=()=>confirmBox("¿Restaurar los ejercicios de A, B y C del plan?",()=>{ Object.assign(c.templates,clone(DEF_TEMPLATES)); saveConfig(); render(); });
  const ib=$("#instB"); if(ib) ib.onclick=async()=>{ if(!deferredPrompt) return; deferredPrompt.prompt(); try{ await deferredPrompt.userChoice; }catch(e){} deferredPrompt=null; render(); };
  const ej=$("#expJson"); if(ej) ej.onclick=()=>exportFile("json");
  const ec=$("#expCsv"); if(ec) ec.onclick=()=>exportFile("csv");
  const im=$("#impBtn"); if(im) im.onclick=importBox;
  bindExtra();
  const ss=$("#shSave"); if(ss) ss.onclick=()=>{ c.sheetsUrl=$("#shUrl").value.trim(); saveConfig(); toast("URL guardada"); };
  const sd=$("#shSend"); if(sd) sd.onclick=()=>{ c.sheetsUrl=$("#shUrl").value.trim(); saveConfig(); syncSheets(true); };
  const sa=$("#shAuto"); if(sa) sa.onclick=()=>{ c.sheetsAuto=!c.sheetsAuto; saveConfig(); render(); };
}
function lastValue(f){ const ks=Object.keys(Store.days).filter(k=>k<cur).sort().reverse(); for(const k of ks){ const v=num(Store.days[k][f]); if(v!=null) return v; } return null; }
function lastActMin(t){ const ks=Object.keys(Store.days).filter(k=>k<cur).sort().reverse(); for(const k of ks){ const a=(migrateDay(Store.days[k]).acts||[]).find(x=>x.t===t&&num(x.min)); if(a) return num(a.min); } return null; }
function buildCSV(){
  const T=tablesForExport(); const q=v=>{ if(v==null) return ""; const s=String(v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const sec=(title,rows)=>{ if(!rows.length) return title+"\n(sin datos)\n\n"; const cols=Object.keys(rows[0]); return title+"\n"+cols.join(",")+"\n"+rows.map(r=>cols.map(c=>q(r[c])).join(",")).join("\n")+"\n\n"; };
  return sec("SEMANAS",T.semanas)+sec("DIAS",T.dias)+sec("SERIES",T.series)+sec("COMIDAS",T.comidas);
}

</script>
