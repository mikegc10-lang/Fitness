<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A2620">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Registro de Gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F1E7;
    --paper-2:#FFFDF8;
    --ink:#2A2620;
    --ink-soft:#8A8172;
    --line:#DDD3BF;
    --income:#0F5C40;
    --income-soft:#DCEEE4;
    --expense:#0057FF;
    --expense-soft:#DDE8FF;
    --gold:#C98A2C;
    --gold-soft:#F1E4C8;
    --radius:14px;
    --font-display:'Space Mono', monospace;
    --font-body:'Manrope', sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--ink);}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    overscroll-behavior-y:none;
  }
  .app{
    max-width:430px;
    margin:0 auto;
    height:100dvh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }
 
  /* ---------- Summary header (sticky, ticket style) ---------- */
  .summary-wrap{
    position:sticky;
    top:0;
    z-index:20;
    flex:0 0 auto;
  }
  .summary{
    background:var(--ink);
    color:var(--paper);
    padding:calc(env(safe-area-inset-top) + 12px) 16px 18px;
  }
  .summary-title{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#c9c1af;
    text-align:center;
    margin:0 0 10px;
    font-weight:600;
  }
  .summary-row{
    display:flex;
    align-items:stretch;
    justify-content:space-between;
  }
  .stat{
    flex:1;
    text-align:center;
    padding:0 4px;
  }
  .stat-label{
    display:block;
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#a89f8c;
    margin-bottom:4px;
  }
  .stat-value{
    display:block;
    font-family:var(--font-display);
    font-weight:700;
    font-size:17px;
    white-space:nowrap;
  }
  .stat-income .stat-value{color:#7fd9ae;}
  .stat-expense .stat-value{color:#86b4ff;}
  .stat-balance{
    position:relative;
    padding:0 10px;
  }
  .stat-balance .stat-value{
    font-size:22px;
    color:var(--gold);
  }
  .stat-balance .stat-value.neg{color:#86b4ff;}
  .divider{
    width:1px;
    background:#4a453c;
    margin:2px 0;
  }
  .ticket-edge{
    height:9px;
    width:100%;
    background:var(--ink);
    display:block;
  }
 
  /* ---------- Content ---------- */
  .content{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:18px 16px calc(24px + env(safe-area-inset-bottom));
  }
  .view{display:none;}
  .view.active{display:block;}
 
  /* ---------- Registrar view ---------- */
  .section-label{
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:700;
    margin:0 0 8px;
  }
  .segmented{
    display:flex;
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:4px;
    gap:4px;
    margin-bottom:16px;
  }
  .seg-btn{
    flex:1;
    border:none;
    background:transparent;
    padding:10px 0;
    font-family:var(--font-body);
    font-weight:700;
    font-size:14px;
    color:var(--ink-soft);
    border-radius:9px;
    cursor:pointer;
  }
  .seg-btn.active.type-gasto{background:var(--expense); color:#fff;}
  .seg-btn.active.type-ingreso{background:var(--income); color:#fff;}
 
  .amount-box{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 16px;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .amount-sign{
    font-family:var(--font-display);
    font-size:26px;
    font-weight:700;
    color:var(--ink-soft);
  }
  #amountInput{
    flex:1;
    border:none;
    background:transparent;
    font-family:var(--font-display);
    font-size:32px;
    font-weight:700;
    color:var(--ink);
    outline:none;
    width:100%;
    -moz-appearance:textfield;
  }
  #amountInput::-webkit-outer-spin-button,
  #amountInput::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  #amountInput::placeholder{color:#c9bfa6;}
 
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:16px;
  }
  .chip{
    border:1px solid var(--line);
    background:var(--paper-2);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:13px;
    font-weight:600;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
  }
  .chip.active.type-gasto{background:var(--expense-soft); border-color:var(--expense); color:var(--expense);}
  .chip.active.type-ingreso{background:var(--income-soft); border-color:var(--income); color:var(--income);}
 
  .field-row{
    display:flex;
    gap:10px;
    margin-bottom:16px;
  }
  .field-row .field{flex:1;}
  .field label{
    display:block;
    font-size:11px;
    color:var(--ink-soft);
    font-weight:600;
    margin-bottom:6px;
  }
  .field input[type="text"],
  .field input[type="date"]{
    width:100%;
    border:1px solid var(--line);
    background:var(--paper-2);
    border-radius:10px;
    padding:10px 12px;
    font-family:var(--font-body);
    font-size:14px;
    color:var(--ink);
    outline:none;
  }
 
  .btn-submit{
    width:100%;
    border:none;
    border-radius:var(--radius);
    padding:15px 0;
    font-family:var(--font-body);
    font-weight:800;
    font-size:15px;
    letter-spacing:.02em;
    color:#fff;
    cursor:pointer;
    margin-bottom:26px;
  }
  .btn-submit.type-gasto{background:var(--expense);}
  .btn-submit.type-ingreso{background:var(--income);}
  .btn-submit:disabled{opacity:.4;}
 
  .today-list .item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:11px 0;
    border-bottom:1px dashed var(--line);
    gap:10px;
  }
  .item-info{min-width:0;}
  .item-cat{font-size:14px; font-weight:700; color:var(--ink);}
  .item-note{font-size:12px; color:var(--ink-soft); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .item-right{display:flex; align-items:center; gap:10px; flex:0 0 auto;}
  .item-amount{font-family:var(--font-display); font-weight:700; font-size:15px; white-space:nowrap;}
  .item-amount.gasto{color:var(--expense);}
  .item-amount.ingreso{color:var(--income);}
  .del-btn{
    border:none; background:none; cursor:pointer; padding:4px;
    color:var(--ink-soft); font-size:15px; line-height:1;
  }
  .empty-state{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    padding:26px 10px;
    border:1px dashed var(--line);
    border-radius:var(--radius);
  }
 
  /* ---------- Historial view ---------- */
  .month-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .month-nav button{
    border:1px solid var(--line);
    background:var(--paper-2);
    width:34px; height:34px;
    border-radius:50%;
    font-size:16px;
    color:var(--ink);
    cursor:pointer;
  }
  .month-label{
    font-family:var(--font-display);
    font-weight:700;
    font-size:15px;
    text-transform:capitalize;
  }
  .month-summary{
    font-size:12px;
    color:var(--ink-soft);
    text-align:center;
    margin-bottom:14px;
  }
  .month-summary b{color:var(--ink); font-weight:700;}
  .filters{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .filter-btn{
    border:1px solid var(--line);
    background:var(--paper-2);
    padding:7px 13px;
    border-radius:20px;
    font-size:12.5px;
    font-weight:700;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .filter-btn.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
 
  .day-group{margin-bottom:18px;}
  .day-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:4px;
  }
  .day-header .day-name{
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--ink-soft);
  }
  .day-header .day-net{
    font-family:var(--font-display);
    font-size:12px;
    font-weight:700;
  }
  .day-net.pos{color:var(--income);}
  .day-net.neg{color:var(--expense);}
 
  /* ---------- Tab bar ---------- */
  .tabbar{
    flex:0 0 auto;
    display:flex;
    border-top:1px solid var(--line);
    background:var(--paper-2);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tab{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    border:none;
    background:transparent;
    padding:10px 0 8px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .tab.active{color:var(--ink);}
  .tab svg{width:21px; height:21px;}
  .tab span{font-size:11px; font-weight:700;}
 
  /* ---------- Toast ---------- */
  .toast{
    position:absolute;
    bottom:76px;
    left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--ink);
    color:var(--paper);
    font-size:13px;
    font-weight:600;
    padding:9px 18px;
    border-radius:20px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:50;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">
 
  <div class="summary-wrap">
    <div class="summary">
      <p class="summary-title">Balance general</p>
      <div class="summary-row">
        <div class="stat stat-income">
          <span class="stat-label">Ingresos</span>
          <span class="stat-value" id="sumIngresos">$0</span>
        </div>
        <div class="divider"></div>
        <div class="stat stat-balance">
          <span class="stat-label">Saldo</span>
          <span class="stat-value" id="sumRemanente">$0</span>
        </div>
        <div class="divider"></div>
        <div class="stat stat-expense">
          <span class="stat-label">Gastos</span>
          <span class="stat-value" id="sumGastos">$0</span>
        </div>
      </div>
    </div>
    <div class="ticket-edge" id="ticketEdge"></div>
  </div>
 
  <main class="content">
 
    <!-- REGISTRAR -->
    <section class="view active" id="view-registrar">
      <p class="section-label">Tipo de movimiento</p>
      <div class="segmented">
        <button class="seg-btn active type-gasto" id="segGasto" data-type="gasto">Gasto</button>
        <button class="seg-btn type-ingreso" id="segIngreso" data-type="ingreso">Ingreso</button>
      </div>
 
      <p class="section-label">Monto</p>
      <div class="amount-box">
        <span class="amount-sign">$</span>
        <input type="number" id="amountInput" inputmode="decimal" placeholder="0" min="0" step="0.01">
      </div>
 
      <p class="section-label">Categoría</p>
      <div class="chips" id="chipsWrap"></div>
 
      <div class="field-row">
        <div class="field">
          <label for="noteInput">Nota (opcional)</label>
          <input type="text" id="noteInput" maxlength="40" placeholder="Ej. Café con Ana">
        </div>
        <div class="field" style="max-width:130px;">
          <label for="dateInput">Fecha</label>
          <input type="date" id="dateInput">
        </div>
      </div>
 
      <button class="btn-submit type-gasto" id="submitBtn">Registrar gasto</button>
 
      <p class="section-label">Hoy</p>
      <div class="today-list" id="todayList"></div>
    </section>
 
    <!-- HISTORIAL -->
    <section class="view" id="view-historial">
      <div class="month-nav">
        <button id="prevMonth" aria-label="Mes anterior">‹</button>
        <span class="month-label" id="monthLabel">—</span>
        <button id="nextMonth" aria-label="Mes siguiente">›</button>
      </div>
      <p class="month-summary" id="monthSummary"></p>
 
      <div class="filters">
        <button class="filter-btn active" data-filter="todos">Todo</button>
        <button class="filter-btn" data-filter="ingreso">Ingresos</button>
        <button class="filter-btn" data-filter="gasto">Gastos</button>
      </div>
 
      <div id="historialList"></div>
    </section>
 
  </main>
 
  <nav class="tabbar">
    <button class="tab active" data-view="registrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>Registrar</span>
    </button>
    <button class="tab" data-view="historial">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span>Historial</span>
    </button>
  </nav>
 
  <div class="toast" id="toast"></div>
</div>
 
<script>
(function(){
  "use strict";
 
  var CATEGORIES = {
    gasto: ['Comida','Transporte','Casa','Salud','Ocio','Otros'],
    ingreso: ['Salario','Extra','Venta','Otros']
  };
 
  var state = {
    type: 'gasto',
    category: CATEGORIES.gasto[0],
    transactions: [],
    filter: 'todos',
    monthCursor: new Date()
  };
  state.monthCursor.setDate(1);
 
  var STORAGE_KEY = 'transacciones';
 
  // ---------- Storage ----------
  async function loadData(){
    try{
      var res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){
        state.transactions = JSON.parse(res.value);
      }
    }catch(e){
      state.transactions = [];
    }
  }
 
  async function saveData(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(state.transactions), false);
    }catch(e){
      showToast('No se pudo guardar');
    }
  }
 
  // ---------- Helpers ----------
  function fmt(n){
    var sign = n < 0 ? '-' : '';
    return sign + '$' + Math.abs(Math.round(n)).toLocaleString('es-MX');
  }
 
  function todayISO(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return d.getFullYear() + '-' + m + '-' + day;
  }
 
  function capitalize(s){
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
 
  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ t.classList.remove('show'); }, 1400);
  }
 
  function computeTotals(list){
    var ing = 0, gas = 0;
    list.forEach(function(tx){
      if(tx.type === 'ingreso') ing += tx.amount;
      else gas += tx.amount;
    });
    return { ingresos: ing, gastos: gas, remanente: ing - gas };
  }
 
  // ---------- Rendering: summary ----------
  function renderSummary(){
    var t = computeTotals(state.transactions);
    document.getElementById('sumIngresos').textContent = fmt(t.ingresos);
    document.getElementById('sumGastos').textContent = fmt(t.gastos);
    var remEl = document.getElementById('sumRemanente');
    remEl.textContent = fmt(t.remanente);
    remEl.classList.toggle('neg', t.remanente < 0);
  }
 
  // ---------- Rendering: registrar ----------
  function renderChips(){
    var wrap = document.getElementById('chipsWrap');
    wrap.innerHTML = '';
    CATEGORIES[state.type].forEach(function(cat){
      var b = document.createElement('button');
      b.className = 'chip type-' + state.type + (cat === state.category ? ' active' : '');
      b.textContent = cat;
      b.addEventListener('click', function(){
        state.category = cat;
        renderChips();
      });
      wrap.appendChild(b);
    });
  }
 
  function renderTodayList(){
    var todayStr = todayISO();
    var list = state.transactions
      .filter(function(tx){ return tx.date === todayStr; })
      .sort(function(a,b){ return b.createdAt - a.createdAt; });
 
    var el = document.getElementById('todayList');
    el.innerHTML = '';
 
    if(list.length === 0){
      el.innerHTML = '<div class="empty-state">Aún no registras movimientos hoy.</div>';
      return;
    }
 
    list.forEach(function(tx){
      el.appendChild(buildItemRow(tx));
    });
  }
 
  function buildItemRow(tx){
    var row = document.createElement('div');
    row.className = 'item';
 
    var info = document.createElement('div');
    info.className = 'item-info';
    var cat = document.createElement('div');
    cat.className = 'item-cat';
    cat.textContent = tx.category;
    info.appendChild(cat);
    if(tx.note){
      var note = document.createElement('div');
      note.className = 'item-note';
      note.textContent = tx.note;
      info.appendChild(note);
    }
    row.appendChild(info);
 
    var right = document.createElement('div');
    right.className = 'item-right';
    var amt = document.createElement('span');
    amt.className = 'item-amount ' + tx.type;
    amt.textContent = (tx.type === 'ingreso' ? '+' : '-') + fmt(tx.amount).replace('-','');
    right.appendChild(amt);
 
    var del = document.createElement('button');
    del.className = 'del-btn';
    del.setAttribute('aria-label','Eliminar');
    del.textContent = '✕';
    del.addEventListener('click', function(){
      deleteTransaction(tx.id);
    });
    right.appendChild(del);
 
    row.appendChild(right);
    return row;
  }
 
  // ---------- Rendering: historial ----------
  function renderMonthNav(){
    var label = state.monthCursor.toLocaleDateString('es-MX', { month:'long', year:'numeric' });
    document.getElementById('monthLabel').textContent = capitalize(label);
  }
 
  function getMonthTransactions(){
    var y = state.monthCursor.getFullYear();
    var m = state.monthCursor.getMonth();
    return state.transactions.filter(function(tx){
      var d = new Date(tx.date + 'T00:00:00');
      return d.getFullYear() === y && d.getMonth() === m;
    });
  }
 
  function renderMonthSummary(monthList){
    var t = computeTotals(monthList);
    document.getElementById('monthSummary').innerHTML =
      'Ingresos <b>' + fmt(t.ingresos) + '</b> · Gastos <b>' + fmt(t.gastos) +
      '</b> · Saldo <b>' + fmt(t.remanente) + '</b>';
  }
 
  function renderHistorialList(){
    var monthList = getMonthTransactions();
    renderMonthSummary(monthList);
 
    var filtered = monthList.filter(function(tx){
      return state.filter === 'todos' || tx.type === state.filter;
    });
 
    var container = document.getElementById('historialList');
    container.innerHTML = '';
 
    if(filtered.length === 0){
      container.innerHTML = '<div class="empty-state">Sin movimientos en este período.</div>';
      return;
    }
 
    // group by date
    var groups = {};
    filtered.forEach(function(tx){
      if(!groups[tx.date]) groups[tx.date] = [];
      groups[tx.date].push(tx);
    });
 
    var dates = Object.keys(groups).sort(function(a,b){ return b.localeCompare(a); });
 
    dates.forEach(function(dateStr){
      var dayTx = groups[dateStr].sort(function(a,b){ return b.createdAt - a.createdAt; });
      var dayTotals = computeTotals(dayTx);
      var net = dayTotals.remanente;
 
      var group = document.createElement('div');
      group.className = 'day-group';
 
      var header = document.createElement('div');
      header.className = 'day-header';
      var d = new Date(dateStr + 'T00:00:00');
      var dayName = capitalize(d.toLocaleDateString('es-MX', { weekday:'short', day:'numeric', month:'short' }));
      header.innerHTML = '<span class="day-name">' + dayName + '</span>' +
        '<span class="day-net ' + (net >= 0 ? 'pos' : 'neg') + '">' + fmt(net) + '</span>';
      group.appendChild(header);
 
      dayTx.forEach(function(tx){
        group.appendChild(buildItemRow(tx));
      });
 
      container.appendChild(group);
    });
  }
 
  // ---------- Actions ----------
  function setType(type){
    state.type = type;
    state.category = CATEGORIES[type][0];
 
    document.getElementById('segGasto').classList.toggle('active', type === 'gasto');
    document.getElementById('segIngreso').classList.toggle('active', type === 'ingreso');
 
    var submitBtn = document.getElementById('submitBtn');
    submitBtn.classList.remove('type-gasto','type-ingreso');
    submitBtn.classList.add('type-' + type);
    submitBtn.textContent = type === 'gasto' ? 'Registrar gasto' : 'Registrar ingreso';
 
    renderChips();
  }
 
  async function addTransaction(){
    var amountInput = document.getElementById('amountInput');
    var amount = parseFloat(amountInput.value);
    if(!amount || amount <= 0){
      amountInput.focus();
      return;
    }
    var dateVal = document.getElementById('dateInput').value || todayISO();
    var note = document.getElementById('noteInput').value.trim();
 
    var tx = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
      type: state.type,
      category: state.category,
      amount: amount,
      note: note,
      date: dateVal,
      createdAt: Date.now()
    };
 
    state.transactions.push(tx);
    await saveData();
 
    amountInput.value = '';
    document.getElementById('noteInput').value = '';
 
    renderSummary();
    renderTodayList();
    renderHistorialList();
    showToast(tx.type === 'gasto' ? 'Gasto registrado' : 'Ingreso registrado');
    amountInput.focus();
  }
 
  async function deleteTransaction(id){
    if(!confirm('¿Eliminar este movimiento?')) return;
    state.transactions = state.transactions.filter(function(tx){ return tx.id !== id; });
    await saveData();
    renderSummary();
    renderTodayList();
    renderHistorialList();
    showToast('Eliminado');
  }
 
  function switchView(view){
    document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
    document.getElementById('view-' + view).classList.add('active');
    document.querySelectorAll('.tab').forEach(function(t){
      t.classList.toggle('active', t.dataset.view === view);
    });
  }
 
  // ---------- Ticket edge (signature element) ----------
  function drawTicketEdge(){
    var edge = document.getElementById('ticketEdge');
    var width = edge.getBoundingClientRect().width;
    var tooth = 14;
    var count = Math.max(6, Math.round(width / tooth));
    var step = 100 / count;
    var points = ['0% 0%'];
    for(var i = 0; i <= count; i++){
      var x = i * step;
      var y = (i % 2 === 0) ? 100 : 0;
      points.push(x + '% ' + y + '%');
    }
    points.push('100% 0%');
    edge.style.clipPath = 'polygon(' + points.join(',') + ')';
  }
 
  // ---------- Init ----------
  async function init(){
    document.getElementById('dateInput').value = todayISO();
 
    document.getElementById('segGasto').addEventListener('click', function(){ setType('gasto'); });
    document.getElementById('segIngreso').addEventListener('click', function(){ setType('ingreso'); });
    document.getElementById('submitBtn').addEventListener('click', addTransaction);
    document.getElementById('amountInput').addEventListener('keydown', function(e){
      if(e.key === 'Enter') addTransaction();
    });
 
    document.querySelectorAll('.tab').forEach(function(t){
      t.addEventListener('click', function(){ switchView(t.dataset.view); });
    });
 
    document.getElementById('prevMonth').addEventListener('click', function(){
      state.monthCursor.setMonth(state.monthCursor.getMonth() - 1);
      renderMonthNav();
      renderHistorialList();
    });
    document.getElementById('nextMonth').addEventListener('click', function(){
      state.monthCursor.setMonth(state.monthCursor.getMonth() + 1);
      renderMonthNav();
      renderHistorialList();
    });
 
    document.querySelectorAll('.filter-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        state.filter = btn.dataset.filter;
        renderHistorialList();
      });
    });
 
    window.addEventListener('resize', drawTicketEdge);
 
    await loadData();
    renderChips();
    renderSummary();
    renderTodayList();
    renderMonthNav();
    renderHistorialList();
    drawTicketEdge();
  }
 
  init();
})();
</script>
</body>
</html>
